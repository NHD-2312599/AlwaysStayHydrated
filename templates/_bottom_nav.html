<script>
(() => {
  const bottomNav = document.querySelector('.bottom-nav');
  const path = window.location.pathname;
  const tab = new URLSearchParams(window.location.search).get('tab');
  let activePage = '';

  if (path === '/' || path === '/home') {
    activePage = ['fill', 'typing'].includes(tab) ? tab : 'home';
  } else if (path.startsWith('/flashcard')) {
    activePage = 'flashcard';
  } else if (path.startsWith('/read')) {
    activePage = 'read';
  } else if (path.startsWith('/missions')) {
    activePage = 'missions';
  } else if (path.startsWith('/timeline')) {
    activePage = 'timeline';
  } else if (path.startsWith('/exam')) {
    activePage = 'exam';
  } else if (path.startsWith('/multiplayer')) {
    activePage = 'multiplayer';
  }

  document.querySelectorAll('.bottom-nav .nav-btn').forEach((item) => {
    item.classList.toggle('active', item.dataset.page === activePage);
  });

  if (bottomNav && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let hideTimer;
    const showNav = () => {
      window.clearTimeout(hideTimer);
      bottomNav.classList.remove('nav-auto-hidden');
    };
    const hideNav = () => {
      window.clearTimeout(hideTimer);
      hideTimer = window.setTimeout(() => bottomNav.classList.add('nav-auto-hidden'), 900);
    };

    bottomNav.classList.add('nav-auto-hidden');
    document.addEventListener('pointermove', (event) => {
      if (event.clientY >= window.innerHeight - 90) showNav();
      else if (!bottomNav.matches(':hover')) hideNav();
    }, { passive: true });
    bottomNav.addEventListener('pointerenter', showNav);
    bottomNav.addEventListener('pointerleave', hideNav);
  }
})();
</script>
