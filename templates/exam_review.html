<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn tập | Always Stay Hydrated</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <script src="/static/js/session-refresh.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-pri); font-family: 'NeueHaasGroteskDisplay', Helvetica, sans-serif; }
    .header { background: rgba(255,255,255,.94); border-bottom: 1px solid var(--border); padding: 0 24px; }
    .header-inner { max-width: 860px; height: 64px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand img { width: 112px; display: block; }
    .back { color: var(--accent-dk); text-decoration: none; font-weight: 700; font-size: .86rem; }
    .main { max-width: 760px; margin: auto; padding: 34px 20px 90px; }
    .eyebrow { color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .subtitle { color: var(--text-sec); line-height: 1.55; margin: 0 0 24px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--border-lt); border-radius: 12px; padding: 10px 14px; color: var(--text-sec); font-size: .84rem; }
    .stat strong { color: var(--accent-dk); font-size: 1.05rem; margin-right: 4px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 18px; }
    .mode-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .mode-label { align-self: center; color: var(--text-ter); font-size: .8rem; font-weight: 700; margin-right: 2px; }
    .filter { border: 1px solid var(--border); background: var(--surface); color: var(--text-sec); border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .filter.active, .filter:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mode-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-sec); border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .mode-btn.active, .mode-btn:hover { background: var(--accent-lt); color: var(--accent-dk); border-color: var(--accent); }
    .review-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .card-top { padding: 20px 22px 12px; display: flex; justify-content: space-between; gap: 12px; color: var(--text-ter); font-size: .82rem; font-weight: 700; }
    .question { padding: 0 22px 20px; font-size: 1.05rem; line-height: 1.65; font-weight: 700; }
    .blank-guide { margin: -4px 22px 18px; padding: 14px 16px; border-radius: 12px; background: #fffaf0; border: 1px solid rgba(200,146,26,.25); color: var(--text-sec); line-height: 1.8; }
    .blank-chip { display: inline-block; min-width: 88px; margin: 0 3px; border-bottom: 2px solid var(--accent); color: var(--accent); letter-spacing: .08em; }
    .answer-box { margin: 0 22px 18px; padding: 16px; border-radius: 12px; background: var(--accent-lt); border: 1px solid rgba(46,125,79,.2); line-height: 1.65; }
    .answer-label { color: var(--accent-dk); font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .answer-box[hidden] { display: none; }
    .user-answer { width: calc(100% - 44px); margin: 0 22px 16px; min-height: 88px; resize: vertical; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font: inherit; color: var(--text-pri); background: var(--bg); }
    .check-result { margin: 0 22px 16px; padding: 11px 14px; border-radius: 10px; font-weight: 700; line-height: 1.5; }
    .check-result[hidden] { display: none; }
    .check-result.correct { background: #e4f5e9; color: #17643a; border: 1px solid #a8d9b7; }
    .check-result.wrong { background: #fff2e4; color: #9a5b12; border: 1px solid #edc68d; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 22px 22px; }
    button { font: inherit; font-weight: 700; cursor: pointer; }
    .primary, .secondary, .status { border-radius: 10px; padding: 9px 12px; border: 1px solid transparent; font-size: .86rem; white-space: nowrap; }
    .primary { background: var(--accent); color: #fff; }
    .secondary { background: var(--surface); border-color: var(--border); color: var(--text-sec); }
    .status { flex: 0 1 auto; min-width: 0; }
    .remember { background: #e4f5e9; color: #17643a; border-color: #a8d9b7; }
    .again { background: #fff2e4; color: #9a5b12; border-color: #edc68d; }
    .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; padding: 44px 22px; text-align: center; color: var(--text-sec); }
    .error { color: var(--red); padding: 30px 0; }
    @media (max-width: 560px) { h1 { font-size: 1.65rem; } .header { padding: 0 16px; } .main { padding: 28px 14px 70px; } .actions { gap: 7px; } .actions > button { flex: 1 1 calc(50% - 7px); } .actions .status { flex-basis: calc(50% - 7px); } }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner">
    <a class="brand" href="/exam_library"><img src="{{ url_for('static', filename='pictures/Logo2.png') }}" alt="Always Stay Hydrated"></a>
    <a class="back" href="/exam_library">← Thư viện</a>
  </div></header>
  <main class="main">
    <div id="loading">Đang tải nội dung ôn tập...</div>
    <section id="content" hidden>
      <div class="eyebrow">📖 Ôn tập đóng ấn</div>
      <h1 id="title">—</h1>
      <p class="subtitle">Tự suy nghĩ trước, sau đó xem đáp án và đánh dấu mức độ ghi nhớ của bạn.</p>
      <div class="stats"><div class="stat"><strong id="mastered-count">0</strong>đã nhớ</div><div class="stat"><strong id="review-count">0</strong>cần ôn lại</div><div class="stat"><strong id="total-count">0</strong>tổng câu</div></div>
      <div class="mode-toolbar"><span class="mode-label">Cách ôn:</span><button class="mode-btn active" data-mode="full">Ôn cả câu</button><button class="mode-btn" data-mode="blank">Ôn phần điền chỗ trống</button></div>
      <div class="toolbar"><button class="filter active" data-filter="all">Tất cả</button><button class="filter" data-filter="review">Cần ôn lại</button></div>
      <div id="review-area"></div>
    </section>
  </main>
<script>
const TAB_ID = {{ tab_id|tojson }};
let cards = [];
let statuses = {};
let filter = 'all';
let studyMode = 'full';
let position = 0;
let answerVisible = false;
let draftAnswer = '';
let checkResult = null;

async function loadReview() {
  try {
    const [cardsRes, progressRes] = await Promise.all([
      apiFetch(`/api/exam/tabs/${TAB_ID}/cards?_=${Date.now()}`),
      apiFetch(`/api/exam/tabs/${TAB_ID}/review-progress?_=${Date.now()}`)
    ]);
    if (!cardsRes.ok || !progressRes.ok) throw new Error('load failed');
    const cardData = await cardsRes.json();
    const progressData = await progressRes.json();
    cards = cardData.cards || [];
    (progressData.statuses || []).forEach(item => { statuses[item.card_id] = item; });
    document.getElementById('title').textContent = cardData.name.replace(/<[^>]*>/g, '');
    document.getElementById('loading').hidden = true;
    document.getElementById('content').hidden = false;
    render();
  } catch (error) {
    document.getElementById('loading').className = 'error';
    document.getElementById('loading').textContent = 'Không thể tải nội dung ôn tập. Vui lòng thử lại.';
  }
}

function filteredCards() {
  return filter === 'review' ? cards.filter(card => statuses[card.id]?.status !== 'mastered') : cards;
}
function escapeHtml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function renderStats() {
  const mastered = cards.filter(card => statuses[card.id]?.status === 'mastered').length;
  document.getElementById('mastered-count').textContent = mastered;
  document.getElementById('review-count').textContent = cards.length - mastered;
  document.getElementById('total-count').textContent = cards.length;
}
function renderBlankGuide(card) {
  if (!card.blank) return '<div class="blank-guide">Câu này chưa có mẫu chỗ trống.</div>';
  return `<div class="blank-guide">${card.blank.split(/_{3,}/).map((part, index, parts) => `${escapeHtml(part)}${index < parts.length - 1 ? '<span class="blank-chip">____</span>' : ''}`).join('')}</div>`;
}
function normalizeText(value) {
  return String(value || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/["']/g, '').replace(/[-–—]/g, ' ').replace(/[.,;:!?()]/g, '');
}
function extractBlankAnswers(card) {
  const parts = String(card.blank || '').split(/_{3,}/).map(part => part.trim()).filter(Boolean);
  const answer = String(card.answer || '');
  const expected = [];
  let searchIndex = 0;
  for (let index = 0; index < parts.length - 1; index++) {
    const left = parts[index];
    const right = parts[index + 1];
    const leftPos = answer.indexOf(left, searchIndex);
    const rightPos = answer.indexOf(right, leftPos >= 0 ? leftPos + left.length : searchIndex);
    if (leftPos >= 0 && rightPos > leftPos + left.length) {
      expected.push(answer.slice(leftPos + left.length, rightPos).trim());
      searchIndex = rightPos;
    }
  }
  return expected.filter(Boolean);
}
function checkBlankAnswer(card, value) {
  const expected = extractBlankAnswers(card);
  const submitted = String(value || '').split(/\r?\n|[;|•]|,\s+/).map(item => item.trim()).filter(Boolean);
  return expected.length > 0 && expected.every(item => submitted.some(entry => normalizeText(entry) === normalizeText(item) || normalizeText(entry).includes(normalizeText(item)) || normalizeText(item).includes(normalizeText(entry))));
}
function captureDraft() {
  const input = document.getElementById('user-answer');
  if (input) draftAnswer = input.value;
}
function checkAnswer() {
  captureDraft();
  const card = filteredCards()[position];
  const correct = studyMode === 'blank' ? checkBlankAnswer(card, draftAnswer) : normalizeText(draftAnswer) === normalizeText(card.answer);
  checkResult = correct ? { correct: true, text: '✓ Chính xác! Bạn có thể đánh dấu Đã nhớ.' } : { correct: false, text: '✗ Chưa đúng. Hãy xem lại đáp án hoặc đánh dấu Cần ôn lại.' };
  render();
}
function render() {
  renderStats();
  const list = filteredCards();
  const area = document.getElementById('review-area');
  if (!list.length) {
    area.innerHTML = '<div class="empty">Bạn đã đánh dấu tất cả câu là <strong>Đã nhớ</strong>.</div>';
    return;
  }
  position = Math.min(position, list.length - 1);
  const card = list[position];
  const status = statuses[card.id]?.status || 'review';
  const prompt = studyMode === 'blank' ? renderBlankGuide(card) : '';
  const answerLabel = studyMode === 'blank' ? 'Đáp án của phần điền' : 'Đáp án tham khảo';
  const resultHtml = checkResult ? `<div class="check-result ${checkResult.correct ? 'correct' : 'wrong'}">${checkResult.text}</div>` : '';
  area.innerHTML = `
    <article class="review-card">
      <div class="card-top"><span>Câu ${position + 1} / ${list.length}</span><span>${status === 'mastered' ? '✓ Đã nhớ' : '○ Cần ôn lại'}</span></div>
      <div class="question">${escapeHtml(card.question)}</div>
      ${prompt}
      <textarea class="user-answer" id="user-answer" placeholder="Bạn có thể tự viết lại câu trả lời ở đây...">${escapeHtml(draftAnswer)}</textarea>
      ${resultHtml}
      <div class="answer-box" id="answer-box" ${answerVisible ? '' : 'hidden'}><div class="answer-label">${answerLabel}</div>${escapeHtml(card.answer)}</div>
      <div class="actions">
        <button class="primary" onclick="checkAnswer()">✓ Kiểm tra</button>
        <button class="secondary" onclick="toggleAnswer()">${answerVisible ? 'Ẩn đáp án' : 'Xem đáp án'}</button>
        <button class="status remember" onclick="saveStatus('mastered')">✓ Đã nhớ</button>
        <button class="status again" onclick="saveStatus('review')">↻ Cần ôn lại</button>
        <button class="secondary" onclick="move(-1)" ${position === 0 ? 'disabled' : ''}>← Câu trước</button>
        <button class="primary" onclick="move(1)" ${position === list.length - 1 ? 'disabled' : ''}>Câu tiếp →</button>
      </div>
    </article>`;
}
function toggleAnswer() { captureDraft(); answerVisible = !answerVisible; render(); }
function move(direction) { captureDraft(); position += direction; draftAnswer = ''; checkResult = null; answerVisible = false; render(); }
async function saveStatus(status) {
  captureDraft();
  const card = filteredCards()[position];
  try {
    const response = await apiFetch(`/api/exam/tabs/${TAB_ID}/review-progress`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ card_id: card.id, status }) });
    if (!response.ok) throw new Error('save failed');
    statuses[card.id] = await response.json().then(data => data.status);
    draftAnswer = '';
    checkResult = null;
    const list = filteredCards();
    if (filter === 'review' && status === 'mastered') position = Math.min(position, Math.max(0, list.length - 1));
    render();
  } catch (error) { alert('Không thể lưu tiến độ. Vui lòng thử lại.'); }
}
document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
  captureDraft(); filter = button.dataset.filter; position = 0; draftAnswer = ''; checkResult = null; answerVisible = false;
  document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button)); render();
}));
document.querySelectorAll('.mode-btn').forEach(button => button.addEventListener('click', () => {
  captureDraft(); studyMode = button.dataset.mode; checkResult = null; answerVisible = false;
  document.querySelectorAll('.mode-btn').forEach(item => item.classList.toggle('active', item === button)); render();
}));
loadReview();
</script>
</body>
</html>
