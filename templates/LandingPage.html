<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2D6A4F">
  <meta name="robots" content="noindex, nofollow">
  <title>Always Stay Hydrated | Đã chuyển tên miền</title>
  <style>
    :root {
      --white: #FFFFFF;
      --cream: #F7F3E8;
      --cream-dark: #EDE8D8;
      --green: #2D6A4F;
      --green-dark: #1B4332;
      --green-deeper: #0D2B1E;
      --text: #0D2B1E;
      --mint: #E8F5E9;
      --line: rgba(13, 43, 30, 0.12);
      --shadow: 0 18px 45px rgba(13, 43, 30, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      border: 1px solid var(--line);
    }

    .logo {
      width: 140px;
      height: auto;
      margin: 0 auto 28px;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--mint);
      color: var(--green-dark);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .badge svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--green-deeper);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    p {
      color: rgba(13, 43, 30, 0.75);
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .old-domain {
      font-size: 0.88rem;
      color: rgba(13, 43, 30, 0.5);
      text-decoration: line-through;
      margin-bottom: 4px;
    }

    .new-domain {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--green);
      word-break: break-all;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      padding: 16px 24px;
      background: var(--green);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(45, 106, 79, 0.25);
    }

    .btn:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(45, 106, 79, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    .countdown {
      margin-top: 22px;
      font-size: 0.88rem;
      color: rgba(13, 43, 30, 0.5);
    }

    .countdown strong {
      color: var(--green);
      font-weight: 700;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: rgba(13, 43, 30, 0.4);
      text-align: center;
    }

    @media (max-width: 420px) {
      .card {
        padding: 32px 22px;
      }
      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="{{ url_for('static', filename='pictures/Logo.png') }}" alt="Always Stay Hydrated" onerror="this.style.display='none'">

    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      Thông báo quan trọng
    </div>

    <h1>Chúng tôi đã chuyển tên miền</h1>

    <p>Website <strong>Always Stay Hydrated</strong> đã được chuyển sang địa chỉ mới.</p>

    <p class="old-domain">alwaysstayhydrated.onrender.com</p>
    <p class="new-domain">alwaysstayhydrated.vercel.app</p>

    <a class="btn" href="https://alwaysstayhydrated.vercel.app/" id="goBtn">
      Đi đến trang mới
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </a>

    <p class="countdown">Tự động chuyển sau <strong id="timer">8</strong> giây…</p>
  </div>

  <p class="footer">Always Stay Hydrated · Cảm ơn bạn đã đồng hành</p>

  <script>
    (function () {
      var seconds = 8;
      var timerEl = document.getElementById('timer');
      var newUrl = 'https://alwaysstayhydrated.vercel.app/';

      // Giữ lại path + query nếu người dùng vào từ link cũ cụ thể
      var path = window.location.pathname + window.location.search + window.location.hash;
      if (path && path !== '/' && path !== '/index.html') {
        newUrl = 'https://alwaysstayhydrated.vercel.app' + path;
        document.getElementById('goBtn').href = newUrl;
      }

      var interval = setInterval(function () {
        seconds -= 1;
        if (timerEl) timerEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.replace(newUrl);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
